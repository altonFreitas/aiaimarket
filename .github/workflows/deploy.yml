name: deploy

# WHAT THIS DOES, AND WHAT IT DELIBERATELY DOES NOT.
#
# It builds the two container images and pushes them to this repository's
# own registry (GitHub Container Registry -- free for the repo, nothing to
# sign up for). It does NOT log in to a server and restart anything: that
# needs a host, an SSH key in this repository's secrets, and a decision
# about who may push to main, none of which belongs in a file written
# before the host exists. Pulling is one command on the server, and
# DEPLOY.md has it.
#
# ONLY AFTER verify.yml HAS PASSED, and that is the whole point of the
# workflow_run trigger rather than a second `on: push`. Two workflows on
# the same push race: the image would be built and published while the
# tests that say whether it works were still running, and a red build
# would still produce a green-looking image.

on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]
    branches: [main]
  # And by hand, for a re-push of an image that was lost or for a first run.
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false      # never cancel a half-pushed image

jobs:
  image:
    # A failed or cancelled verify must not reach here. workflow_run fires
    # on every conclusion, so this is the gate, not the trigger.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    # Named by the deploy job below, so the thing that is rolled out is the
    # thing that was built rather than whatever :latest happens to be by
    # the time it gets there.
    outputs:
      app: ${{ steps.names.outputs.app }}
      sha: ${{ steps.names.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, which
          # would build a DIFFERENT commit from the one that passed. Name
          # the commit that was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # NEXT_PUBLIC_* is compiled into the browser bundle, so a missing one
      # does not fail the build -- it produces an image that starts, serves
      # pages, and cannot reach Supabase, with the only clue in a browser
      # console. Stop here instead.
      - name: Check the values that get baked in
        env:
          URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          missing=""
          [ -n "$URL"  ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$KEY"  ] || missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -n "$SITE" ] || missing="$missing NEXT_PUBLIC_SITE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Set these as repository VARIABLES (Settings ->"\
                 "Secrets and variables -> Actions -> Variables):$missing"
            echo "They are public by design -- the anon key is in every"\
                 "visitor's network tab -- so they are variables, not secrets."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided by Actions; no token to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the images
        id: names
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          sha=$(echo "${{ github.event.workflow_run.head_sha || github.sha }}" | cut -c1-7)
          echo "app=ghcr.io/$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The server. Tagged with the commit as well as with latest, because
      # "roll back" means naming a version, and `latest` cannot be named.
      - name: Build and push the server
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.names.outputs.app }}:latest
            ${{ steps.names.outputs.app }}:${{ steps.names.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_STORE_NAME=${{ vars.NEXT_PUBLIC_STORE_NAME }}
            NEXT_PUBLIC_STORE_TZ=${{ vars.NEXT_PUBLIC_STORE_TZ }}
            APP_REVISION=${{ steps.names.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The scheduler. Same Dockerfile, different target: four lines of
      # shell and curl, so it is small and changes almost never.
      - name: Build and push the scheduler
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cron
          push: true
          tags: |
            ${{ steps.names.outputs.app }}-cron:latest
            ${{ steps.names.outputs.app }}-cron:${{ steps.names.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what to pull
        run: |
          {
            echo "### Images pushed"
            echo ""
            echo '```'
            echo "${{ steps.names.outputs.app }}:${{ steps.names.outputs.sha }}"
            echo "${{ steps.names.outputs.app }}-cron:${{ steps.names.outputs.sha }}"
            echo '```'
            echo ""
            echo "On the server:"
            echo ""
            echo '```sh'
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo ""
            echo "Then check the deploy actually landed:"
            echo ""
            echo '```sh'
            echo "curl -s https://YOUR-DOMAIN/api/health"
            echo "# {\"ok\":true,\"revision\":\"${{ steps.names.outputs.sha }}\",...}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------
  # Onto the server
  # -----------------------------------------------------------------------
  # OPT-IN, AND SILENT UNTIL IT IS. Until DEPLOY_HOST is set this job does
  # not run at all: publishing the image is useful on its own, and a repo
  # with no server yet should not have a red workflow to remind it.
  #
  # WHAT IT DOES ON THE SERVER is the same three commands DEPLOY.md gives a
  # person -- pull, up, check -- with two things a person doing it by hand
  # would also do and a script usually forgets: it pins the exact commit
  # rather than :latest, and it puts the previous one back if the new one
  # does not answer.
  deploy:
    needs: image
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: read

    # The address it went to, on the run's page, so "which server did this
    # reach" is never a question.
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      # DEPLOY_HOST is a variable and can be read in `if` above; a secret
      # cannot, so the pair is checked here instead. A host set without a
      # key is a misconfiguration and should be loud, not skipped.
      - name: Check the rest of the settings are there
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$KEY" ]   || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$KNOWN" ] || missing="$missing DEPLOY_KNOWN_HOSTS"
          [ -n "${{ vars.DEPLOY_USER }}" ] || missing="$missing DEPLOY_USER(var)"
          [ -n "${{ vars.DEPLOY_PATH }}" ] || missing="$missing DEPLOY_PATH(var)"
          if [ -n "$missing" ]; then
            echo "::error::DEPLOY_HOST is set, so this job runs -- but these are missing:$missing"
            echo "DEPLOY.md, 'Deploying a change', lists all five and how to get them."
            exit 1
          fi

      # KNOWN HOSTS, NOT StrictHostKeyChecking=no, and this is the whole
      # reason DEPLOY_KNOWN_HOSTS exists. Turning the check off hands the
      # deploy key and a root-ish shell to whatever answers on that address
      # -- which on the first run of a hijacked DNS record is exactly what
      # you would not notice. Get the value with:
      #     ssh-keyscan -p 22 your.server.tl
      - name: Trust the one server, and no other
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # EVERYTHING GOES IN ON stdin, values included. Passed as arguments
      # to ssh instead -- which is the ordinary way to do this -- they
      # become the remote shell's command line and are readable in the
      # server's process list for as long as the deploy takes. The
      # registry token above all.
      - name: Write the deploy script
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            printf 'DEPLOY_PATH=%s\n'   "'${{ vars.DEPLOY_PATH }}'"
            printf 'IMAGE=%s\n'         "'${{ needs.image.outputs.app }}'"
            printf 'REVISION=%s\n'      "'${{ needs.image.outputs.sha }}'"
            printf 'REGISTRY_USER=%s\n' "'${{ github.actor }}'"
            printf 'REGISTRY_TOKEN=%s\n' "'$REGISTRY_TOKEN'"
            cat <<'OUTER'
          set -eu
          cd "$DEPLOY_PATH"

          # Which port the shop is published on, read from Docker rather
          # than guessed: APP_PORT lives in the server's .env, which this
          # script does not read (and must not -- it holds the keys).
          shop_port() {
            docker compose port app 3000 2>/dev/null | tail -1 | sed 's/.*://' || true
          }
          revision_now() {
            p=$(shop_port)
            [ -n "$p" ] || return 0
            curl -fsS -m 5 "http://127.0.0.1:$p/api/health" 2>/dev/null \
              | sed -n 's/.*"revision":"\([^"]*\)".*/\1/p' || true
          }

          # What is running before anything changes, so a deploy that does
          # not come up can be put back. Empty on a first deploy, and then
          # there is nothing to go back to.
          PREVIOUS=$(revision_now)
          echo "running now: ${PREVIOUS:-nothing}"

          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          export APP_IMAGE="$IMAGE:$REVISION"
          export CRON_IMAGE="$IMAGE-cron:$REVISION"
          docker compose pull
          # --no-build: the server pulls, it does not compile. Building
          # here would need the NEXT_PUBLIC_* values again and would take
          # ten minutes on a small box.
          docker compose up -d --no-build --remove-orphans

          # DID IT ACTUALLY COME UP, or did something merely restart? This
          # is the difference between a deploy and a green tick.
          deployed=""
          for _ in $(seq 1 30); do
            if [ "$(revision_now)" = "$REVISION" ]; then deployed=1; break; fi
            sleep 2
          done
          if [ -n "$deployed" ]; then
            echo "deployed $REVISION"
            exit 0
          fi

          echo "::error::$REVISION did not answer within 60s"
          # Back to what was there, but only when that is a commit this
          # registry has. A shop built by hand reports "local", and
          # pulling ghcr.io/...:local would fail in a way that reads like
          # a second unrelated problem.
          case "$PREVIOUS" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f])
              if [ "$PREVIOUS" != "$REVISION" ]; then
                echo "putting $PREVIOUS back"
                export APP_IMAGE="$IMAGE:$PREVIOUS" CRON_IMAGE="$IMAGE-cron:$PREVIOUS"
                docker compose up -d --no-build || true
              fi
              ;;
            *) echo "nothing to roll back to (was: ${PREVIOUS:-nothing})" ;;
          esac
          exit 1
          OUTER
          } > /tmp/deploy.sh

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -p "${{ vars.DEPLOY_PORT || 22 }}" \
              "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
              bash -s < /tmp/deploy.sh

      - name: Leave no key behind
        if: always()
        run: rm -f ~/.ssh/id_deploy /tmp/deploy.sh
